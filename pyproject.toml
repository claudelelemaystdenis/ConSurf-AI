[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "consurf-ai"
version = "1.0.0"
description = "Per-residue evolutionary conservation grades (ConSurf scale 1-9) without a multiple sequence alignment"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
    "torch>=2.1",          # LayerNorm(bias=...) needs 2.1
    "transformers>=4.30",
    "accelerate",          # lower peak RAM when loading ESM2-3B
    "gemmi>=0.6",
    "numpy",
    "pandas",
    # Intel Macs: PyTorch stops at 2.2.2 there, recent transformers need a newer PyTorch,
    # PyTorch 2.2.2 does not work with NumPy 2, and pandas 3 requires NumPy 2.
    "transformers<5; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "numpy<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "pandas<3; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[project.scripts]
consurf-ai = "consurf_ai.cli:main"

[tool.setuptools]
packages = ["consurf_ai"]
